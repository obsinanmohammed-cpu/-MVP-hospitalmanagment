# ============================================================
# java-ci.yml
# Automated PR Review Pipeline using GitHub Actions
# Runs automatically on every push and pull request
# ============================================================

name: Hospital System CI Pipeline

# WHEN TO RUN — triggers on every push and every pull request
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── JOB 1: COMPILE AND BUILD ────────────────────────────────
  build:
    name: Compile Java Code
    runs-on: ubuntu-latest        # runs on GitHub's free Linux server

    steps:

      # Step 1 — Download your code onto the server
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3 — Create the output folder
      - name: Create output folder
        run: mkdir -p out

      # Step 4 — Compile all Java files
      # If ANY file has an error this step fails and pipeline stops
      - name: Compile all Java source files
        run: |
          echo "Compiling Hospital Management System..."
          javac -d out -sourcepath src src/Main.java
          echo "Compilation successful!"

      # Step 5 — Check that the compiled files exist
      - name: Verify compiled output
        run: |
          echo "Checking compiled files..."
          ls -la out/
          echo "Build verified successfully!"

  # ── JOB 2: CODE QUALITY CHECKS ──────────────────────────────
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: build                  # only runs if build passed

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Check 1 — Make sure all required files exist
      - name: Check required files exist
        run: |
          echo "Checking all required Java files..."

          files=(
            "src/model/Person.java"
            "src/model/Patient.java"
            "src/model/Doctor.java"
            "src/model/Surgeon.java"
            "src/model/GeneralPractitioner.java"
            "src/model/Appointment.java"
            "src/service/Hospital.java"
            "src/util/InputHelper.java"
            "src/Main.java"
            "README.md"
          )

          all_found=true
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "  FOUND: $file"
            else
              echo "  MISSING: $file"
              all_found=false
            fi
          done

          if [ "$all_found" = false ]; then
            echo "ERROR: Some required files are missing!"
            exit 1
          fi

          echo "All required files found!"

      # Check 2 — Verify OOP concepts are present in the code
      - name: Check OOP concepts are implemented
        run: |
          echo "Checking OOP concepts in source code..."

          # Check Encapsulation — private fields must exist
          if grep -r "private" src/model/Person.java > /dev/null; then
            echo "  PASSED: Encapsulation (private fields found in Person.java)"
          else
            echo "  FAILED: No private fields found in Person.java"
            exit 1
          fi

          # Check Inheritance — extends keyword must exist
          if grep -r "extends" src/model/ > /dev/null; then
            echo "  PASSED: Inheritance (extends keyword found)"
          else
            echo "  FAILED: No inheritance found in model folder"
            exit 1
          fi

          # Check Polymorphism — @Override must exist
          if grep -r "@Override" src/model/ > /dev/null; then
            echo "  PASSED: Polymorphism (@Override found)"
          else
            echo "  FAILED: No @Override found — polymorphism missing"
            exit 1
          fi

          # Check Abstraction — abstract class must exist
          if grep -r "abstract" src/model/Person.java > /dev/null; then
            echo "  PASSED: Abstraction (abstract class found)"
          else
            echo "  FAILED: No abstract class found in Person.java"
            exit 1
          fi

          # Check Static members — static keyword must exist
          if grep -r "static" src/model/Appointment.java > /dev/null; then
            echo "  PASSED: Static members found in Appointment.java"
          else
            echo "  FAILED: No static members found in Appointment.java"
            exit 1
          fi

          # Check Method Overloading in Hospital.java
          if grep -c "findPatient" src/service/Hospital.java | grep -q "^[2-9]"; then
            echo "  PASSED: Method overloading (findPatient appears multiple times)"
          else
            echo "  WARNING: Method overloading may not be implemented"
          fi

          echo "All OOP concept checks passed!"

      # Check 3 — Check code style basics
      - name: Check code style
        run: |
          echo "Checking code style..."

          # Check that files are not empty
          for file in src/model/*.java src/service/*.java src/Main.java; do
            lines=$(wc -l < "$file")
            if [ "$lines" -lt 5 ]; then
              echo "  WARNING: $file seems too short ($lines lines)"
            else
              echo "  OK: $file ($lines lines)"
            fi
          done

          # Check that README exists and is not empty
          if [ -s "README.md" ]; then
            echo "  PASSED: README.md exists and has content"
          else
            echo "  FAILED: README.md is missing or empty"
            exit 1
          fi

          echo "Code style checks completed!"

  # ── JOB 3: FINAL REPORT ─────────────────────────────────────
  report:
    name: Pipeline Report
    runs-on: ubuntu-latest
    needs: [build, code-quality]  # only runs if both jobs passed

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Print a full summary report
      - name: Print final pipeline report
        run: |
          echo "================================================"
          echo "   HOSPITAL MANAGEMENT SYSTEM - CI REPORT"
          echo "================================================"
          echo ""
          echo "  Build          : PASSED"
          echo "  Code Quality   : PASSED"
          echo "  OOP Concepts   : VERIFIED"
          echo "  README         : FOUND"
          echo ""
          echo "  Java Files found:"
          find src -name "*.java" | while read f; do
            echo "    - $f"
          done
          echo ""
          echo "  Total Java files: $(find src -name '*.java' | wc -l)"
          echo ""
          echo "================================================"
          echo "   ALL CHECKS PASSED - PIPELINE SUCCESSFUL"
          echo "================================================"
